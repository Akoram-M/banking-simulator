server:
  port: 8080

spring:
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  datasource:
    url: jdbc:postgresql://localhost:5432/banking_simulator
    username: postgres
    password: test
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
      
springdoc:
  api-docs:
    # Custom path for the OpenAPI JSON spec (default is /v3/api-docs)
    path: • http://localhost:8080/account-service/v3/api-doc
  swagger-ui:
    # Custom path for the interactive UI (default is /swagger-ui.html)
    path: http://localhost:8080/account-service/swagger-ui.html
    operationsSorter: method